apply plugin: 'kotlin'

sourceCompatibility = 17
targetCompatibility = 17

repositories {
    mavenCentral()
}

dependencies {
    api "com.badlogicgames.gdx:gdx:$gdxVersion"
    api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"

    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit5:$kotlinVersion"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // WorldMapTest builds a real Pixmap, which is backed by libGDX's native gdx2d code. Loading
    // those natives (GdxNativesLoader.load(), see WorldMapTest) needs no GL context and no window,
    // so pathfinding stays testable headlessly - hence natives on the TEST classpath only; the
    // core module itself must stay backend-agnostic.
    testRuntimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

// Tests cover the pure game logic (economy, combat maths, fleet simulation, save round-trips,
// pathfinding) - not the Scene2D/rendering layer, which would need a real GL context to exercise
// and is verified by actually running the game instead (see CLAUDE.md's testing discipline).
test {
    // The balance simulation lives in the test sources but is not a test: it asserts nothing,
    // because what the right numbers ARE is exactly what M15 has to decide. Excluded here and
    // run on demand through the `simulate` task below.
    useJUnitPlatform {
        excludeTags 'simulation', 'reference'
    }
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}

// ./gradlew.bat :core:reference - rewrites the generated tables in Reference/ from the code they
// describe (ship stats, goods, reputation, warehouses, loans, captains). Tagged `reference` and
// excluded from `test` above, so an ordinary test run never touches files on disk. Run it as part
// of a version bump; see Reference/README.md.
tasks.register('reference', Test) {
    group = 'documentation'
    description = 'Regenerates the numeric tables in Reference/ from the code.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'reference'
    }
    testLogging {
        showStandardStreams = true
        exceptionFormat "full"
    }
    outputs.upToDateWhen { false }
}

// ./gradlew.bat :core:simulate - runs the economy headless for a few hundred game days and prints
// the resulting curves (plus a CSV under core/build/simulation/). The point is to be able to
// change one constant and see where the whole economy lands, instead of playing for an hour and
// going on how it felt. Never up-to-date: the entire purpose is re-running it after a tweak.
tasks.register('simulate', Test) {
    group = 'verification'
    description = 'Runs the headless economy/balance simulation (see BalanceSimulation).'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'simulation'
    }
    testLogging {
        showStandardStreams = true
        exceptionFormat "full"
    }
    outputs.upToDateWhen { false }
}
